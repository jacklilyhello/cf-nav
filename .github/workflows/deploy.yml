name: Deploy
on:
  push:
    branches: [main, codex/cloudflare-navigation]
  workflow_dispatch:
    inputs:
      environment:
        type: choice
        required: true
        default: staging
        options: [staging, production]
permissions:
  contents: read
concurrency:
  group: cf-nav-deploy-${{ inputs.environment || 'staging' }}
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TARGET_ENV: ${{ inputs.environment || 'staging' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require main for production
        run: |
          if [ "$TARGET_ENV" = production ] && [ "$GITHUB_REF" != refs/heads/main ]; then
            echo 'Production must deploy main'; exit 1
          fi
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Migrate isolated environment
        run: npx wrangler d1 migrations apply DB --remote --env "$TARGET_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Bootstrap audited catalog once
        run: node scripts/seed.mjs "$TARGET_ENV"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy Worker and assets
        run: npx wrangler deploy --env "$TARGET_ENV" --var "APP_VERSION:$GITHUB_SHA"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Smoke workers.dev deployment
        run: |
          if [ "$TARGET_ENV" = production ]; then HOST=cf-nav; else HOST=cf-nav-staging; fi
          node scripts/smoke.mjs "https://$HOST.lilyya.workers.dev"
        env:
          EXPECTED_VERSION: ${{ github.sha }}
