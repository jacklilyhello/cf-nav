name: Production Domain
on:
  workflow_dispatch:
    inputs:
      operation:
        type: choice
        required: true
        options: [production, rollback]
      acceptance:
        description: Confirm staging browser acceptance and production workers.dev smoke for this main SHA
        type: boolean
        required: true
        default: false
permissions:
  contents: read
concurrency:
  group: cf-nav-production-domain
  cancel-in-progress: false
jobs:
  domain:
    if: inputs.acceptance && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Change only the navigation custom domain and read it back
        run: node scripts/cutover.mjs "$OPERATION"
        env:
          OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
          CF_WORKER_NAME: ${{ vars.CF_WORKER_NAME }}
          CF_PRODUCTION_DOMAIN: ${{ vars.CF_PRODUCTION_DOMAIN }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: domain-bindings
          path: build/domain-*.json
          retention-days: 90
