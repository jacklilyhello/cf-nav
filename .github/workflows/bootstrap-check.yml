name: Cloudflare Resources
on:
  workflow_dispatch:
    inputs:
      operation:
        description: Inspect existing resources or provision isolated cf-nav resources
        type: choice
        required: true
        default: inspect
        options: [inspect, provision]
permissions:
  contents: read
concurrency:
  group: cf-nav-cloudflare-resources
  cancel-in-progress: false
jobs:
  resources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
      - name: Inspect or provision cf-nav resources
        run: node scripts/cloudflare.mjs "$OPERATION"
        env:
          OPERATION: ${{ inputs.operation }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_ZONE_ID: ${{ vars.CLOUDFLARE_ZONE_ID }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cloudflare-resources
          path: build/cloudflare-resources.json
          retention-days: 30
