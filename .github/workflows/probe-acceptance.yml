name: Temporary probe acceptance fixture
on:
  workflow_dispatch:
    inputs:
      action:
        description: Deploy or remove only the isolated cf-nav-acceptance test Worker
        type: choice
        required: true
        default: deploy
        options: [deploy, remove]
permissions:
  contents: read
concurrency:
  group: cf-nav-probe-acceptance
  cancel-in-progress: false
jobs:
  fixture:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Generate isolated configuration with no application bindings
        run: |
          mkdir -p build/probe-acceptance
          cat > build/probe-acceptance/wrangler.json <<'JSON'
          {
            "name": "cf-nav-acceptance",
            "main": "../../tests/fixtures/probe-acceptance-worker.ts",
            "compatibility_date": "2026-10-01",
            "compatibility_flags": ["global_fetch_strictly_public"],
            "workers_dev": true,
            "preview_urls": false,
            "observability": { "enabled": false },
            "logpush": false
          }
          JSON
      - name: Verify temporary fixture
        if: inputs.action == 'deploy'
        run: |
          npx vitest run tests/probe-acceptance.test.ts
          npx wrangler deploy --config build/probe-acceptance/wrangler.json --dry-run --outdir build/probe-acceptance/bundle
      - name: Deploy only temporary acceptance Worker
        if: inputs.action == 'deploy'
        run: npx wrangler deploy --config build/probe-acceptance/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      - name: Remove only temporary acceptance Worker
        if: inputs.action == 'remove'
        run: npx wrangler delete cf-nav-acceptance --config build/probe-acceptance/wrangler.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
